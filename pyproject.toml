[project]
name = "paper-factory"
version = "0.0.1"
description = "Multi-agent research paper system organized as a research lab."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "apscheduler>=3.10",
    "gitpython>=3.1",
    "python-dotenv>=1.0",
    "anthropic>=0.39",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["orchestrator*", "agents*", "lab*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
